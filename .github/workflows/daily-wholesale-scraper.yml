
name: Daily Wholesale Price Scraper

on:
  workflow_dispatch:
  schedule:
    # Daily at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: daily-wholesale-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run wholesale price scraper
        run: python main.py

      - name: Update public JSON
        run: |
          mkdir -p public
          cp output/wholesale_prices_latest.json public/wholesale_prices_latest.json

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ public/wholesale_prices_latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update wholesale prices $(date -u +%F)"
            git push
          fi
